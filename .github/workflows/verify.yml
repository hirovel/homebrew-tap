name: Verify Apple Silicon installation

on:
  workflow_dispatch:
    inputs:
      previous_tap_ref:
        description: Previous tap commit SHA for an upgrade check (leave both inputs empty for a fresh install)
        required: false
        type: string
      previous_version:
        description: Version installed by the previous commit, for example 0.1.0
        required: false
        type: string

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      PREVIOUS_TAP_REF: ${{ inputs.previous_tap_ref }}
      PREVIOUS_VERSION: ${{ inputs.previous_version }}
    steps:
      - name: Install the public package
        run: |
          test "$(uname -m)" = arm64
          if [[ -n "$PREVIOUS_TAP_REF" || -n "$PREVIOUS_VERSION" ]]; then
            [[ "$PREVIOUS_TAP_REF" =~ ^[0-9a-f]{40}$ ]]
            [[ "$PREVIOUS_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          fi
          brew tap hirovel/tap
          tap="$(brew --repository hirovel/tap)"
          current_version="$(sed -n 's/^  version "\([0-9][0-9.]*\)"$/\1/p' "$tap/Formula/novelite-tui.rb")"
          [[ "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'TAP_PATH=%s\nCURRENT_VERSION=%s\n' "$tap" "$current_version" >> "$GITHUB_ENV"
          expected="$current_version"
          if [[ -n "$PREVIOUS_TAP_REF" ]]; then
            git -C "$tap" fetch origin "$PREVIOUS_TAP_REF"
            git -C "$tap" checkout --detach "$PREVIOUS_TAP_REF"
            expected="$PREVIOUS_VERSION"
          fi
          brew install hirovel/tap/novelite-tui
          brew test hirovel/tap/novelite-tui
          binary="$(brew --prefix hirovel/tap/novelite-tui)/bin/novelite-tui"
          test "$("$binary" --version)" = "Novelite TUI $expected"
          codesign --verify --strict "$binary"
          file "$binary"
          otool -L "$binary"
          printf 'Initial installed version: %s\n' "$expected" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare user files outside Homebrew
        run: |
          data="$RUNNER_TEMP/novelite-user-data"
          mkdir -p "$data"
          printf 'Chapter One\n\nKeep this manuscript.\n' > "$data/manuscript.md"
          printf '{"F6":"save"}\n' > "$data/keymap.json"
          shasum -a 256 "$data/manuscript.md" "$data/keymap.json" > "$RUNNER_TEMP/novelite-user-data.sha256"
      - name: Verify the update entry point and retained files
        run: |
          if [[ -n "$PREVIOUS_TAP_REF" ]]; then
            git -C "$TAP_PATH" checkout main
            test -z "$(git -C "$TAP_PATH" status --porcelain)"
          fi
          brew update
          brew upgrade novelite-tui
          test "$(novelite-tui --version)" = "Novelite TUI $CURRENT_VERSION"
          brew test hirovel/tap/novelite-tui
          binary="$(brew --prefix hirovel/tap/novelite-tui)/bin/novelite-tui"
          codesign --verify --strict "$binary"
          file "$binary"
          otool -L "$binary"
          shasum -a 256 --check "$RUNNER_TEMP/novelite-user-data.sha256"
          printf 'Final installed version: %s; manuscript and keymap bytes retained.\n' "$CURRENT_VERSION" >> "$GITHUB_STEP_SUMMARY"
